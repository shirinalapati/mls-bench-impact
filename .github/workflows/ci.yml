name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install -r requirements.txt
          python -m pip install -e .
      - name: Lint
        run: python -m ruff check src tests
      - name: Unit & schema tests
        run: |
          export PYTHONPATH=src
          python -m pytest tests -q
      - name: Docs presence
        run: |
          python - <<'PY'
          from pathlib import Path
          req = [
            "README.md","PROJECT_PLAN.md","DATA_FEASIBILITY_AUDIT.md","DATA_SOURCE_AUDIT.md",
            "EVENT_SCHEMA_AUDIT.md","SUBSTITUTION_DATA_AUDIT.md",
            "docs/methodology.md","docs/validation.md","docs/deployment.md","docs/limitations.md",
            "FINAL_RELEASE_CHECKLIST.md","CHANGELOG.md"
          ]
          missing = [p for p in req if not Path(p).exists()]
          assert not missing, missing
          PY