[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mls-bench-impact"
version = "1.0.0"
description = "MLS Bench Impact — identifying Major League Soccer's most effective substitutes"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Being rewritten locally (st.navigation); fix import order there, then drop this.
"src/mls_bench_impact/app/streamlit_app.py" = ["I001"]
